services:
  db:
    image: postgres:18-alpine
    container_name: pricing-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: pricing
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d pricing"]
      interval: 1s
      timeout: 2s
      retries: 30

  app:
    image: product-price-history-api:native
    container_name: pricing-app
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://db:5432/pricing
      QUARKUS_DATASOURCE_USERNAME: app
      QUARKUS_DATASOURCE_PASSWORD: app
      QUARKUS_LOG_CATEGORY__IO_QUARKUS__LEVEL: INFO
    ports:
      - "8080:8080"
    mem_limit: 256m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /q/health/ready HTTP/1.0\\r\\n\\r\\n' >&3; read -r status <&3; case \"$$status\" in *' 200 '*) exit 0;; *) exit 1;; esac"]
      interval: 250ms
      timeout: 1s
      retries: 120

  k6:
    image: grafana/k6:1.1.0
    container_name: pricing-k6
    profiles: ["perf"]
    volumes:
      - ./perf:/perf:ro
    environment:
      BASE_URL: http://app:8080
    command: run /perf/k6-script.js
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      app:
        condition: service_healthy
